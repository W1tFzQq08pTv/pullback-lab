name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      # Image builds run npm ci, TypeScript checks, Vite build,
      # locked Python dependency installation and Python compilation.
      - name: Build image
        run: docker compose build
      - name: Start services
        run: docker compose up -d --wait --wait-timeout 180
      - name: Check runtime dependencies
        run: |
          docker compose exec -T backend python - <<'PY'
          import baostock
          import numpy as np
          import pandas as pd
          from py_mini_racer import py_mini_racer
          from pathlib import Path
          engine = py_mini_racer.MiniRacer()
          assert engine.eval('1 + 1') == 2
          engine.eval(Path('/app/backend/vendor/sina_decoder.js').read_text())
          assert engine.eval('typeof d') == 'function'
          assert pd.Series(np.array([1., 2., 3.])).rolling(2).mean().iloc[-1] == 2.5
          PY
      - name: Check frontend and API
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from urllib.error import HTTPError
          base = 'http://127.0.0.1:8080'
          def get(path):
              return urllib.request.urlopen(base + path, timeout=10).read()
          html = get('/').decode()
          assert '<div id="root">' in html
          assets = re.findall(r'(?:src|href)="(/assets/[^"]+)"', html)
          assert assets, 'Built frontend assets missing'
          for asset in assets:
              assert get(asset)
          overview = json.loads(get('/api/overview'))
          assert overview['snapshot'] is None
          assert overview['stock']['symbol'] == '002028.SZ'
          for path in ('/api/does-not-exist', '/assets/does-not-exist.js'):
              try:
                  get(path)
                  raise AssertionError(f'{path} should return 404')
              except HTTPError as error:
                  assert error.code == 404
          # A valid same-origin write must reach the application (409 on empty
          # data), rather than being rejected by the origin guard (403).
          request = urllib.request.Request(
              base + '/api/signals/latest', data=b'{}',
              headers={'Content-Type': 'application/json', 'Origin': base})
          try:
              urllib.request.urlopen(request, timeout=10)
              raise AssertionError('Expected empty-data rejection')
          except HTTPError as error:
              assert error.code == 409, (error.code, error.read())
          PY
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop services
        if: always()
        run: docker compose down
