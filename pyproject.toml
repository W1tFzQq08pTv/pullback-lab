[project]
name = "pullback-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "mini-racer>=0.12.4; sys_platform != 'linux'",
    "py-mini-racer>=0.6.0; sys_platform == 'linux'",
    "akracer>=0.0.13; sys_platform == 'linux'",
    "beautifulsoup4>=4.12",
    "pypdf>=5",
    "baostock>=0.8.9,<0.9",
]
